services:
  tradingagents:
    build:
      context: .
      target: app
    env_file:
      - .env
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    tty: true
    stdin_open: true

  tests:
    build:
      context: .
      target: test
    environment:
      - TRADINGAGENTS_CACHE_DIR=/tmp/tradingagents-cache
      - TRADINGAGENTS_RESULTS_DIR=/tmp/tradingagents-results
      - TRADINGAGENTS_MEMORY_LOG_PATH=/tmp/tradingagents-memory/trading_memory.md
    volumes:
      - .:/build
    working_dir: /build
    profiles:
      - test

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  tradingagents-ollama:
    build:
      context: .
      target: app
    env_file:
      - .env
    environment:
      - LLM_PROVIDER=ollama
      - TRADINGAGENTS_CACHE_DIR=/home/appuser/.tradingagents/cache
      - TRADINGAGENTS_RESULTS_DIR=/home/appuser/.tradingagents/logs
      - TRADINGAGENTS_MEMORY_LOG_PATH=/home/appuser/.tradingagents/memory/trading_memory.md
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

volumes:
  tradingagents_data:
  ollama_data:
